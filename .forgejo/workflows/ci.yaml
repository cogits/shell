on: [push]
jobs:
  test:
    runs-on: codeberg-small
    steps:
      - name: Check out
        uses: https://github.com/actions/checkout@v4

      - name: Install Zig
        uses: https://github.com/mlugg/setup-zig@v2

      - name: Run test
        run: |
          zig build test

      - name: Fuzz parser against grammar oracle
        run: |
          zig build test --fuzz=20K

      - name: Build shell
        run: |
          zig build release --summary all
